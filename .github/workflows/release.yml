# Publishes to npm when a `v<version>` tag is pushed. This is the only way the
# package gets published; there is no local publish path.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance attestations
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # nothing here pushes to git, so don't leave the token configured
          persist-credentials: false
      - uses: jdx/mise-action@v5

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # npm (not pnpm) because npm's CLI performs the trusted-publishing OIDC exchange.
      # Access and provenance come from publishConfig in package.json.
      - run: npm publish
