# Plug'n'Play with no fallback: every package can resolve only what it
# declares. The default fallback would let this library borrow the app's own
# dependencies and hide a missing declaration, which this project exists to catch.
nodeLinker: pnp
pnpFallbackMode: none
# The tarball is rebuilt each run, so the lockfile is regenerated rather than kept.
enableImmutableInstalls: false
enableTelemetry: false

packageExtensions:
  # @nestjs/core 12's typings import @standard-schema/spec without declaring it.
  '@nestjs/core@*':
    dependencies:
      '@standard-schema/spec': 1.1.0
